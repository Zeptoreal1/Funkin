name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h /

      - name: Checkout (with assets + art submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ \
            libx11-dev libxi-dev libxext-dev libxinerama-dev libxrandr-dev \
            libgl-dev libgl1-mesa-dev libasound2-dev libpulse-dev

      - name: Install Android NDK (SDK is pre-installed on the runner)
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          echo "Using $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;25.2.9519653" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"

      - name: Set up Haxe 4.3.7
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.7

      - name: Install hmm and project libraries
        run: |
          haxelib --global install hmm
          haxelib --global run hmm setup
          hmm install

      - name: Set up Lime (same steps as the official build)
        run: |
          haxelib --always run lime setup
          haxelib run lime rebuild hxcpp
          haxelib run lime rebuild cpp -64

      - name: Configure Lime for Android
        run: |
          haxelib run lime config ANDROID_SDK "$ANDROID_HOME"
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_NDK_HOME"
          haxelib run lime config JAVA_HOME "$JAVA_HOME"
          haxelib run lime config ANDROID_SETUP true

      - name: Rebuild Lime for Android (64-bit phones)
        run: haxelib run lime rebuild android -arm64

      - name: Build APK
        run: haxelib run lime build android -arm64 -release -DGITHUB_BUILD -DEXCLUDE_ARMV7

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: funkin-android-apk
          path: export/**/bin/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
