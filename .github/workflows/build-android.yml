name: Build Android APK

# Simple Android build for forks. The official build-game.yml uses FunkinCrew's
# private runners and secrets, so it will NOT work on a fork.
# Run it from the Actions tab: "Build Android APK" -> "Run workflow".
# The APK shows up under "Artifacts" at the bottom of the finished run.
# NOTE: untested as written. If a step fails, paste the red log here and we'll fix it.

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h /

      - name: Checkout (with assets + art submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager "ndk;25.2.9519653" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"

      - name: Set up Haxe 4.3.7
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.7

      - name: Install hmm and project libraries
        run: |
          haxelib --global install hmm
          haxelib --global run hmm setup
          hmm install

      - name: Configure Lime for Android
        run: |
          haxelib run lime setup -alias -y
          haxelib run lime config ANDROID_SDK "$ANDROID_HOME"
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_NDK_HOME"
          haxelib run lime config JAVA_HOME "$JAVA_HOME"
          haxelib run lime config ANDROID_SETUP true

      - name: Build APK
        run: lime build android -release -DGITHUB_BUILD

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: funkin-android-apk
          path: export/**/bin/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
